[workspace]
resolver = "2"
members = ["crates/mw-core", "crates/mw-format", "crates/mw-io", "crates/mw-markdown", "crates/mw-probe", "crates/mw-shell", "crates/mw-render", "crates/mw-golden", "crates/mw-ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
opt-level = 3
strip = true
